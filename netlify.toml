[build]
  base = "."
  command = "npm install --prefix portfolio && npm install --prefix weekdashboard && npm run build --prefix portfolio && npm run build --prefix weekdashboard && rm -rf dist && mkdir -p dist/portfolio && cp -R weekdashboard/out/. dist/ && cp -R portfolio/build/. dist/portfolio/"
  publish = "dist"

[[redirects]]
  from = "/portfolio"
  to = "/portfolio/"
  status = 301
